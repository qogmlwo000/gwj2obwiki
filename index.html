<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GWJ2 OB WIKI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-shell">
    <div class="warp-layer warp-layer-back"></div>
    <div class="warp-layer warp-layer-mid"></div>
    <div class="warp-ring ring-a"></div>
    <div class="warp-ring ring-b"></div>
    <div class="noise-grid"></div>
    <div class="light-burst"></div>

    <main class="hero" aria-label="GWJ2 OB WIKI landing">
      <p class="hero-kicker">COUPANG FULFILLMENT SERVICES</p>
      <h1 class="hero-title">
        <span>GWJ2</span>
        <span>OB WIKI</span>
      </h1>
      <p class="hero-subtitle">Developer Bennett</p>
    </main>

    <footer class="status-panel" aria-label="Build progress status">
      <p class="status-text">&#xC81C;&#xC791; &#xC9C4;&#xD589;&#xC911;</p>
      <div class="progress-meta">
        <span>ARCHIVE BUILD</span>
        <span>5%</span>
      </div>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="5" aria-label="&#xD604;&#xC7AC; &#xC81C;&#xC791; &#xC9C4;&#xD589;&#xB960;">
        <div class="progress-fill"></div>
      </div>
      <p class="progress-caption">5%</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
